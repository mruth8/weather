description=Colors the sky from the real weather and time of day in a city you choose. Off by default; turn off the core Skybox plugin first.
tags=weather,sky,skybox,time,day,night,rain,snow
plugins=com.mruth8.realweathersky.RealWeatherSkyPlugin
warning=When you turn on the weather lookup, this plugin sends the city you typed, then its approximate coordinates, to the third-party service Open-Meteo (open-meteo.com) every 10 minutes while you are logged in. Open-Meteo can see your IP address. No account or character data is sent. The plugin is off until you enter a city and enable the lookup.
